# Quieter Spark output for the labs: warnings and errors only.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n
logger.kafka.name = org.apache.kafka
logger.kafka.level = error
logger.ivy.name = org.apache.ivy
logger.ivy.level = warn
# The IQVIA header repeats "OTHER_Patient Visits"; Spark renames the copies and would warn about it on every read.
logger.csvheader.name = org.apache.spark.sql.catalyst.csv.CSVHeaderChecker
logger.csvheader.level = error
# Large lab jobs spill to disk when memory is short; that's expected, so don't warn about it.
logger.memorystore.name = org.apache.spark.storage.memory.MemoryStore
logger.memorystore.level = error
logger.blockmanager.name = org.apache.spark.storage.BlockManager
logger.blockmanager.level = error

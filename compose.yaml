# HealthRiskAI course infrastructure: Apache Kafka and a small Apache Spark cluster (Labs 3 and up), plus Apache
# Hadoop HDFS for the data lake (Labs 5 and up). HDFS is in the "hdfs" profile, so it only starts when you turn that
# profile on first: in PowerShell run  $env:COMPOSE_PROFILES = "hdfs"   (macOS / Linux: export COMPOSE_PROFILES=hdfs)
#
# Run every command from this folder (the repository folder):
#   docker compose up -d        start everything in the background
#   docker compose ps           check status (kafka and spark-master, plus namenode and datanode from Lab 5, should
#                               say "healthy")
#   docker compose down         stop and remove the containers (Kafka topics are deleted too)
#
# Web pages (only reachable from your own computer):
#   Spark cluster:           http://localhost:8081
#   A running Spark job:     http://localhost:4040
#   HDFS data lake:          http://localhost:9870
#
# Only this repository folder is shared with the containers, mounted at /opt/healthriskai.
# The licensed IQVIA file goes in data/iqvia/ and is never committed; never put real patient records here.

name: healthriskai

x-spark: &spark
  image: spark:4.1.3-python3
  user: root                          # lets Spark write lab output into the shared folder on every OS
  working_dir: /opt/healthriskai
  volumes:
    - ./:/opt/healthriskai
    - spark-ivy:/opt/ivy              # Spark's download cache (the Kafka connector), kept between runs
  networks: [backend]

x-hadoop: &hadoop
  image: apache/hadoop:3.4.2
  profiles: ["hdfs"]                                   # started only when the hdfs profile is on (Labs 5 and up)
  environment: &hadoop-env
    CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
    HDFS-SITE.XML_dfs.namenode.rpc-address: namenode:8020
    HDFS-SITE.XML_dfs.namenode.name.dir: file:///tmp/hadoop/dfs/name
    HDFS-SITE.XML_dfs.datanode.data.dir: file:///tmp/hadoop/dfs/data
    HDFS-SITE.XML_dfs.replication: "1"                # one DataNode, so one copy of each block
    HDFS-SITE.XML_dfs.permissions.enabled: "false"    # the labs write as one user; no HDFS permission checks
    HADOOP_HEAPSIZE_MAX: 512m
  volumes:
    - ./:/opt/healthriskai:ro                          # read-only: HDFS only reads files to upload
  networks: [backend]

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller          # KRaft mode: no ZooKeeper
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"        # you create topics yourself in the labs
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - ./:/opt/healthriskai:ro                        # read-only: Kafka only reads the sample files
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    networks: [backend]

  spark-master:
    <<: *spark
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_HOST: spark-master
    ports:
      - "127.0.0.1:8081:8080"   # Spark cluster web page
      - "127.0.0.1:4040:4040"   # web page of a running Spark job
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/spark-master/7077"]
      interval: 5s
      timeout: 3s
      retries: 12

  spark-worker:
    <<: *spark
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      spark-master:
        condition: service_healthy

  namenode:
    <<: *hadoop
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment:
      <<: *hadoop-env
      ENSURE_NAMENODE_DIR: /tmp/hadoop/dfs/name        # format the new (empty) file system on first start
    ports:
      - "127.0.0.1:9870:9870"   # HDFS web page
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/namenode/9870"]
      interval: 5s
      timeout: 3s
      retries: 24

  datanode:
    <<: *hadoop
    hostname: datanode
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/datanode/9864"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  spark-ivy:

networks:
  backend:

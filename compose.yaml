# HealthRiskAI course infrastructure (Labs 3 and 4): Apache Kafka plus a small Apache Spark cluster.
#
# Run every command from this folder (the repository folder):
#   docker compose up -d        start everything in the background
#   docker compose ps           check status (kafka and spark-master should say "healthy")
#   docker compose down         stop and remove the containers (Kafka topics are deleted too)
#
# Web pages (only reachable from your own computer):
#   Spark cluster:           http://localhost:8081
#   A running Spark job:     http://localhost:4040
#
# Only this repository folder is shared with the containers, mounted at /opt/healthriskai.
# Synthetic data only: never put real patient data in this folder.

name: healthriskai

x-spark: &spark
  image: spark:4.1.3-python3
  user: root                          # lets Spark write lab output into the shared folder on every OS
  working_dir: /opt/healthriskai
  volumes:
    - ./:/opt/healthriskai
    - spark-ivy:/opt/ivy              # Spark's download cache (the Kafka connector), kept between runs
  networks: [backend]

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller          # KRaft mode: no ZooKeeper
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"        # you create topics yourself in the labs
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - ./:/opt/healthriskai:ro                        # read-only: Kafka only reads the sample files
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    networks: [backend]

  spark-master:
    <<: *spark
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_HOST: spark-master
    ports:
      - "127.0.0.1:8081:8080"   # Spark cluster web page
      - "127.0.0.1:4040:4040"   # web page of a running Spark job
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/spark-master/7077"]
      interval: 5s
      timeout: 3s
      retries: 12

  spark-worker:
    <<: *spark
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      spark-master:
        condition: service_healthy

volumes:
  spark-ivy:

networks:
  backend:
